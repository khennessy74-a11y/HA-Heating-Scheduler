# Preview: schedule management only; physical heating start/stop are not registered.
# All write services are disabled unless explicitly opted in.
add_schedule:
  name: Add heating schedule
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    start:
      required: true
      selector:
        time: {}
    weekdays:
      required: true
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    minutes:
      required: true
      selector:
        number:
          min: 15
          max: 240
          step: 15
    enabled:
      required: false
      default: true
      selector:
        boolean: {}
edit_schedule:
  name: Edit heating schedule
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    entity_id:
      required: true
      selector:
        entity:
          domain: switch
    name:
      required: true
      selector:
        text: {}
    start:
      required: true
      selector:
        time: {}
    weekdays:
      required: true
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    minutes:
      required: true
      selector:
        number:
          min: 15
          max: 240
          step: 15
    enabled:
      required: false
      default: true
      selector:
        boolean: {}
remove_schedule:
  name: Remove disabled heating schedule
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    entity_id:
      required: true
      selector:
        entity:
          domain: switch
