# Service descriptions from the Beta 2 reference package.
# Service handlers are NOT registered by the current development __init__.py.
start:
  name: Start timed heating
  description: Start a timed session on the selected heating device.
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    minutes:
      required: true
      selector:
        number:
          min: 15
          max: 240
          step: 15
          mode: box
stop:
  name: Stop timed heating
  fields:
    entry_id:
      required: true
      selector:
        text: {}
add_schedule:
  name: Add heating schedule
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    name:
      required: true
      selector:
        text: {}
    start:
      required: true
      selector:
        time: {}
    weekdays:
      required: true
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    minutes:
      required: true
      selector:
        number:
          min: 15
          max: 240
          step: 15
    enabled:
      required: false
      default: true
      selector:
        boolean: {}
edit_schedule:
  name: Edit heating schedule
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    entity_id:
      required: true
      selector:
        entity:
          domain: switch
    name:
      required: true
      selector:
        text: {}
    start:
      required: true
      selector:
        time: {}
    weekdays:
      required: true
      selector:
        select:
          multiple: true
          options: [mon, tue, wed, thu, fri, sat, sun]
    minutes:
      required: true
      selector:
        number:
          min: 15
          max: 240
          step: 15
    enabled:
      required: false
      default: true
      selector:
        boolean: {}
remove_schedule:
  name: Remove disabled heating schedule
  fields:
    entry_id:
      required: true
      selector:
        text: {}
    entity_id:
      required: true
      selector:
        entity:
          domain: switch
