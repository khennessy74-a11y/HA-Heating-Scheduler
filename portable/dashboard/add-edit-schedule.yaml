      - type: button
        entity: input_boolean.heating_day_sun
        name: S
        show_icon: false
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              padding: 0;
              margin: auto;
