type: custom:bubble-card
card_type: pop-up
hash: '#addheat'
name: Heating Schedule
icon: mdi:calendar-plus
popup_mode: centered
width_desktop: 500px
full_width_on_mobile: false
scrolling_effect: false
cards:
  - type: custom:mushroom-legacy-template-card
    primary: |-
      {% if states('input_text.heating_edit_selected')
            .startswith('switch.schedule_') %}
        Edit Heating Schedule
      {% else %}
        Add Heating Schedule
      {% endif %}
    secondary: |-
      {% if states('input_text.heating_edit_selected')
            .startswith('switch.schedule_') %}
        Update an existing heating schedule
      {% else %}
        Create a new heating schedule
      {% endif %}
    icon: |-
      {% if states('input_text.heating_edit_selected')
            .startswith('switch.schedule_') %}
        mdi:calendar-edit
      {% else %}
        mdi:calendar-plus
      {% endif %}
    icon_color: primary
    layout: horizontal
    tap_action:
      action: none
  - type: custom:super-text-input
    entity: input_text.heating_schedule_name
    label: Schedule name
    placeholder: e.g. Morning Heating
    update_mode: realtime
    debounce_time: 300
  - type: entities
    show_header_toggle: false
    entities:
      - entity: input_datetime.heating_new_on_time
        name: Turn heating on at
        icon: mdi:clock-start
      - entity: input_select.heating_duration_choice
        name: Heating duration
        icon: mdi:timer-outline
  - type: custom:bubble-card
    card_type: separator
    name: Repeat on
    icon: mdi:calendar-week
  - type: grid
    columns: 7
    square: false
    cards:
      - type: button
        entity: input_boolean.heating_day_mon
        name: M
        show_icon: false
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              padding: 0;
              margin: auto;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 600;
              {% if is_state(config.entity, 'on') %}
                background: var(--primary-color);
                color: var(--text-primary-color);
              {% else %}
                background: var(--card-background-color);
                color: var(--primary-text-color);
              {% endif %}
            }
      - type: button
        entity: input_boolean.heating_day_tue
        name: T
        show_icon: false
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              padding: 0;
              margin: auto;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 600;
              {% if is_state(config.entity, 'on') %}
