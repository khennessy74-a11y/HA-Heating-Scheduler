                color: var(--text-primary-color);
              {% else %}
                background: var(--card-background-color);
                color: var(--primary-text-color);
              {% endif %}
            }
      - type: button
        entity: input_boolean.heating_day_wed
        name: W
        show_icon: false
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              padding: 0;
              margin: auto;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 600;
              {% if is_state(config.entity, 'on') %}
                background: var(--primary-color);
                color: var(--text-primary-color);
              {% else %}
                background: var(--card-background-color);
                color: var(--primary-text-color);
              {% endif %}
            }
      - type: button
        entity: input_boolean.heating_day_thu
        name: T
        show_icon: false
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              padding: 0;
              margin: auto;
              display: flex;
              align-items: center;
              justify-content: center;
