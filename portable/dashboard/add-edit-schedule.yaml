                background: var(--card-background-color);
                color: var(--primary-text-color);
              {% endif %}
            }
      - type: button
        entity: input_boolean.heating_day_fri
        name: F
        show_icon: false
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              width: 42px;
              height: 42px;
              border-radius: 50%;
              padding: 0;
              margin: auto;
              display: flex;
