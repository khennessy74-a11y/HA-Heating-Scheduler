# Portable Heating Control — mobile action slot avoids overlapping text
type: custom:bubble-card
card_type: pop-up
hash: '#heatpop'
name: Heating Control
button_type: name
show_icon: false
show_name: true
scrolling_effect: false
cards:
  - type: custom:bubble-card
    card_type: separator
    name: Heating Schedules
    icon: mdi:calendar-clock
  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    show_empty: false
    filter:
      include:
        - entity_id: switch.schedule_*
          options:
            type: custom:button-card
            name: |
              [[[
                return (entity.attributes.friendly_name || entity.entity_id)
                  .replace(/^Scheduler\s+/i, '');
              ]]]
            icon: mdi:av-timer
            show_name: true
            show_icon: true
            show_state: false
            show_label: true
            label: |
              [[[
                const action = (entity.attributes.actions || []).find(
                  a => a.service === 'script.turn_on');
                const minutes = Number(action?.data?.variables?.minutes);
                let duration = 'Duration unavailable';
                if (Number.isFinite(minutes) && minutes > 0) {
                  const h = Math.floor(minutes / 60), m = minutes % 60;
                  duration = h && m ? h + ' hr ' + m + ' min'
                    : h ? (h === 1 ? '1 hour' : h + ' hours')
                    : minutes + ' minutes';
                }
                const names = {mon:'Mon',tue:'Tue',wed:'Wed',thu:'Thu',
                  fri:'Fri',sat:'Sat',sun:'Sun'};
                const ordered = ['mon','tue','wed','thu','fri','sat','sun'];
                const days = entity.attributes.weekdays || [];
                const daysText = !Array.isArray(days) ? 'Days unavailable'
                  : ordered.every(d => days.includes(d)) ? 'Every day'
                  : ['mon','tue','wed','thu','fri'].every(d => days.includes(d))
                    && !days.includes('sat') && !days.includes('sun') ? 'Mon–Fri'
                  : days.length === 2 && days.includes('sat') && days.includes('sun') ? 'Weekends'
                  : ordered.filter(d => days.includes(d)).map(d => names[d]).join(', ') || 'Days unavailable';
                const status = entity.state === 'on' ? '● Enabled'
                  : entity.state === 'off' ? '○ Disabled' : 'Status unavailable';
                return duration + ' · ' + daysText + '\n' + status;
              ]]]
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            state:
              - value: 'on'
                icon: mdi:timer-check
                color: green
              - value: 'off'
                icon: mdi:timer-off-outline
                color: grey
            custom_fields:
              delete:
                card:
                  type: custom:button-card
                  entity: |
                    [[[ return entity.entity_id; ]]]
                  icon: mdi:trash-can-outline
                  show_name: false
                  show_icon: true
                  show_state: false
                  show_label: false
                  size: 20px
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    target:
                      entity_id: script.heating_delete_schedule
                    data:
                      variables:
                        schedule_entity: |
                          [[[[ return entity.entity_id; ]]]]
                    confirmation:
                      text: |
                        [[[[
                          const name = (entity.attributes.friendly_name || entity.entity_id)
                            .replace(/^Scheduler\s+/i, '');
                          return 'Permanently delete "' + name + '"?\n\nThis cannot be undone.';
                        ]]]]
                  styles:
                    card:
                      - background: transparent
                      - box-shadow: none
                      - border: none
                      - padding: 0
                      - height: 32px
                      - width: 32px
                    icon:
                      - color: var(--error-color)
                      - width: 22px
            styles:
              card:
                - min-height: 158px
                - border-radius: 16px
                - box-shadow: none
                - padding: 10px
              grid:
                - grid-template-areas: '"i i" "n n" "l l" ". delete"'
                - grid-template-columns: 1fr 32px
                - grid-template-rows: 34px min-content min-content 34px
                - row-gap: 3px
              icon:
                - width: 30px
                - justify-self: center
              name:
                - font-size: 14px
                - white-space: normal
                - line-height: 1.3
                - text-align: center
              label:
                - font-size: 12px
                - color: var(--secondary-text-color)
                - white-space: pre-line
                - line-height: 1.4
                - text-align: center
              custom_fields:
                delete:
                  - grid-area: delete
                  - justify-self: end
                  - align-self: center
                  - display: |
                      [[[ return entity.state === 'off' ? 'block' : 'none'; ]]]
                  - pointer-events: |
                      [[[ return entity.state === 'off' ? 'auto' : 'none'; ]]]
    sort:
      method: friendly_name
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.heating_save_status
        state: saved
    card:
      type: custom:mushroom-legacy-template-card
      primary: Schedule saved!
      secondary: Heating schedule saved successfully.
      icon: mdi:check-circle
      icon_color: primary
      layout: horizontal
      tap_action:
        action: none
  - type: custom:bubble-card
    card_type: separator
    name: Manage Schedules
    icon: mdi:calendar-plus
  - type: custom:button-card
    name: Add Heating Schedule
    label: Create a new heating schedule
    icon: mdi:calendar-plus
    show_name: true
    show_label: true
    show_icon: true
    tap_action:
      action: multi-actions
      actions:
        - action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.heating_cancel_schedule
        - wait_completion: |
            [[[
              return states['script.heating_cancel_schedule']?.state === 'off'
                && states['input_text.heating_edit_selected']?.state === '';
            ]]]
          timeout: 5s
        - action: navigate
          navigation_path: '#addheat'
    styles:
      card:
        - height: 64px
        - border-radius: var(--ha-card-border-radius)
        - background: var(--card-background-color)
        - box-shadow: none
        - padding: 12px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 45px 1fr
        - grid-template-rows: min-content min-content
      icon:
        - width: 25px
        - color: var(--primary-color)
      name:
        - font-size: 14px
        - justify-self: start
      label:
        - font-size: 12px
        - justify-self: start
        - color: var(--secondary-text-color)
  - type: custom:mushroom-legacy-template-card
    primary: Manage Heating Schedules
    secondary: Edit existing times, days and durations
    icon: mdi:calendar-edit
    icon_color: primary
    layout: horizontal
    tap_action:
      action: navigate
      navigation_path: '#manageheat'
    hold_action:
      action: none
