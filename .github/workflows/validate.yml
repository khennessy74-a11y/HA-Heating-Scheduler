name: Validate Heating Scheduler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate Python, YAML and JSON
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import yaml

          counts = {'python': 0, 'yaml': 0, 'json': 0}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix == '.py':
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
                  counts['python'] += 1
              elif path.suffix in ('.yaml', '.yml'):
                  with path.open(encoding='utf-8') as stream:
                      yaml.safe_load(stream)
                  counts['yaml'] += 1
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
                  counts['json'] += 1
          print('Validation passed:', counts)
          PY

      - name: Run isolated session-policy tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
