name: Validate Heating Scheduler

on:
  push:
  pull_request:
  workflow_dispatch:

# Superseded pushes on the same branch do not need duplicate full validation.
concurrency:
  group: heating-scheduler-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML voluptuous

      - name: Validate Python, YAML and JSON
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import yaml

          counts = {'python': 0, 'yaml': 0, 'json': 0}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix == '.py':
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
                  counts['python'] += 1
              elif path.suffix in ('.yaml', '.yml'):
                  with path.open(encoding='utf-8') as stream:
                      yaml.safe_load(stream)
                  counts['yaml'] += 1
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
                  counts['json'] += 1
          print('Validation passed:', counts)
          PY

      - name: Run isolated session-policy tests
        run: timeout 120s python -m unittest discover -s tests -p 'test_*.py' -v

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate custom integration with hassfest
        uses: home-assistant/actions/hassfest@master

  homeassistant-import:
    name: Home Assistant import smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Home Assistant Python package
        run: python -m pip install --disable-pip-version-check homeassistant

      - name: Import integration modules and validate schemas
        run: |
          python - <<'PY'
          import importlib

          from homeassistant.helpers import config_validation as cv

          package = importlib.import_module("custom_components.heating_scheduler")
          assert package.CONFIG_SCHEMA is not None

          for suffix in (
              "config_flow",
              "ha_switch",
              "ha_scheduler_services",
              "service_registration",
              "scheduler_bridge",
              "controller",
          ):
              importlib.import_module("custom_components.heating_scheduler." + suffix)
              print("Imported:", suffix)

          from custom_components.heating_scheduler.service_registration import _SCHEMAS
          assert set(_SCHEMAS) == {"add_schedule", "edit_schedule", "remove_schedule"}
          for name, schema in _SCHEMAS.items():
              assert schema is not None
              print("Schema available:", name)

          from custom_components.heating_scheduler.service_registration import (
              schedule_writes_allowed,
              async_register_schedule_services,
              SCHEDULE_MUTATIONS_RELEASED,
          )
          from custom_components.heating_scheduler.runtime import (
              HEATING_RUNTIME_RELEASED,
              HeatingRuntimeUnavailable,
              HeatingRuntimeCoordinator,
          )
          assert HEATING_RUNTIME_RELEASED is False
          assert SCHEDULE_MUTATIONS_RELEASED is False
          from homeassistant.exceptions import ServiceValidationError
          from types import SimpleNamespace
          from unittest.mock import AsyncMock

          class InMemoryServices:
              def __init__(self):
                  self.handlers = {}
                  self.calls = AsyncMock()

              def async_register(self, domain, name, handler, schema=None, supports_response=None):
                  self.handlers[(domain, name)] = (handler, schema)

          class InMemoryHA:
              def __init__(self):
                  self.data = {"heating_scheduler": {"test_entry": {"target_entity": "switch.test_only"}}}
                  self.services = InMemoryServices()
                  self.entry = SimpleNamespace(domain="heating_scheduler", options={})
                  self.config_entries = SimpleNamespace(
                      async_get_entry=lambda key: self.entry if key == "test_entry" else None,
                  )

          # Exercise actual integration setup / unload coroutines using installed
          # Home Assistant libraries with in-memory services and entries only.
          import asyncio
          async def lifecycle_smoke():
              entry = SimpleNamespace(
                  entry_id="test_entry", data={"target_entity": "switch.test_only"},
                  domain="heating_scheduler", options={},
              )
              local = InMemoryHA()
              assert await package.async_setup(local, {}) is True
              assert await package.async_setup_entry(local, entry) is True
              assert local.data["heating_scheduler"]["test_entry"]["target_entity"] == "switch.test_only"
              assert await package.async_unload_entry(local, entry) is True
              assert "test_entry" not in local.data["heating_scheduler"]
              # The service endpoints are still denied even after unload.
              for (domain, name), (handler, schema) in local.services.handlers.items():
                  if name == "list_schedules":
                      continue
                  try:
                      await handler(SimpleNamespace(service=name, data={"entry_id": "test_entry"}))
                  except ServiceValidationError:
                      pass
                  else:
                      raise AssertionError(f"Unexpected service acceptance: {name}")
              assert not local.services.calls.called
          asyncio.run(lifecycle_smoke())

          # Lifecycle safety remains enforced with a manually opted-in entry.
          async def gated_runtime_smoke():
              constructed = []
              def make_switch(entry_id):
                  constructed.append(entry_id)
                  raise AssertionError("Switch construction must remain disabled")
              runtime = HeatingRuntimeCoordinator(make_switch)
              for action in (runtime.start("test_entry", 15),
                             runtime.stop("test_entry")):
                  try:
                      await action
                  except HeatingRuntimeUnavailable:
                      pass
                  else:
                      raise AssertionError("Hardware runtime unexpectedly enabled")
              assert not constructed
              assert not runtime.active_entries

              entry = SimpleNamespace(
                  entry_id="test_entry", data={"target_entity": "switch.test_only"},
                  domain="heating_scheduler",
                  options={"enable_schedule_writes": True},
              )
              local = InMemoryHA()
              local.entry = entry
              await package.async_setup(local, {})
              await package.async_setup_entry(local, entry)
              assert not schedule_writes_allowed(local, "test_entry")
              for name, (handler, schema) in [
                  (name, pair)
                  for (domain, name), pair in local.services.handlers.items()
              ]:
                  # Only write services are expected to reject an opted-in caller.
                  # list_schedules is a deliberately permitted read-only service.
                  if name == "list_schedules":
                      continue
                  try:
                      await handler(SimpleNamespace(service=name, data={
                          "entry_id": "test_entry"
                      }))
                  except ServiceValidationError:
                      pass
                  else:
                      raise AssertionError(f"Write bypassed gate: {name}")
              assert not local.services.calls.called
              await package.async_unload_entry(local, entry)
              assert not schedule_writes_allowed(local, "test_entry")
          asyncio.run(gated_runtime_smoke())

          hass = InMemoryHA()
          async_register_schedule_services(hass)
          async_register_schedule_services(hass)
          assert len(hass.services.handlers) == 3
          assert not schedule_writes_allowed(hass, "test_entry")

          valid_add = {
              "entry_id": "test_entry", "name": "Morning", "start": "06:30",
              "weekdays": ["mon", "tue"], "minutes": 60, "enabled": True,
          }
          assert _SCHEMAS["add_schedule"](valid_add) == valid_add
          for name, payload in (
              ("add_schedule", valid_add),
              ("edit_schedule", {**valid_add, "entity_id": "switch.schedule_test"}),
              ("remove_schedule", {"entry_id": "test_entry", "entity_id": "switch.schedule_test"}),
          ):
              handler, schema = hass.services.handlers[("heating_scheduler", name)]
              validated = schema(payload)
              try:
                  import asyncio
                  asyncio.run(handler(SimpleNamespace(service=name, data=validated)))
              except ServiceValidationError:
                  pass
              else:
                  raise AssertionError(f"{name} unexpectedly allowed a write")
              print("Rejected disabled write:", name)

          print("PASS: 3 real-library service schemas and default-deny dispatch checks")
          print("PASS: no Home Assistant server or hardware was started")
          PY

  homeassistant-runtime:
    name: Disposable Home Assistant runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Home Assistant testing framework
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pytest-homeassistant-custom-component

      - name: Exercise runtime lifecycle without hardware
        run: timeout 240s python -m pytest runtime_tests -q -s
